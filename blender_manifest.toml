  "wheels/attrs-25.3.0-py3-none-any.whl",
  "wheels/affine-2.4.0-py3-none-any.whl",
  "wheels/cligj-0.7.2-py3-none-any.whl",
  "wheels/click-8.1.8-py3-none-any.whl",
  "wheels/rasterio-1.4.3-cp311-cp311-win_amd64.whl"
]



